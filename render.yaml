# Render Blueprint - Despliegue automatizado
# Más info: https://render.com/docs/blueprint-spec

services:
  # Servicio tipo Background Worker (no duerme, ideal para bots con polling)
  - type: worker
    name: vbv-telegram-bot
    env: python
    region: oregon  # o frankfurt si estás en Europa
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_vbv_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false  # Se configura manualmente en el dashboard de Render
      - key: PYTHONUNBUFFERED
        value: 1
      - key: TZ
        value: America/Bogota